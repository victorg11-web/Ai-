<script>

let money = 100000;

const newsList = [
  '🚀 Tesla stiger efter nye AI biler!',
  '📉 Apple falder efter dårlige salgstal!',
  '🔥 NVIDIA eksploderer i gaming markedet!',
  '💰 Microsoft investerer milliarder i AI!',
  '⚡ Amazon vokser hurtigt i dag!',
  '📈 Hele markedet går op!'
];

const stocks = [
  {
    name:'Tesla',
    symbol:'TSLA',
    price:1200,
    owned:0,
    history:[1200]
  },

  {
    name:'Apple',
    symbol:'AAPL',
    price:900,
    owned:0,
    history:[900]
  },

  {
    name:'NVIDIA',
    symbol:'NVDA',
    price:1500,
    owned:0,
    history:[1500]
  },

  {
    name:'Microsoft',
    symbol:'MSFT',
    price:800,
    owned:0,
    history:[800]
  }
];

const stocksDiv = document.getElementById('stocks');

function graph(history){

  const max = Math.max(...history);
  const min = Math.min(...history);

  return history.map((p,i)=>{

    const y = 60 - ((p-min)/(max-min || 1))*50;

    return `${i*20},${y}`;

  }).join(' ');
}

function render(){

  stocksDiv.innerHTML='';

  stocks.forEach((stock,index)=>{

    const previousPrice =
      stock.history[stock.history.length - 2] || stock.price;

    const up = stock.price >= previousPrice;

    const change =
      (((stock.price - previousPrice) / previousPrice) * 100).toFixed(2);

    const div = document.createElement('div');

    div.className='stock';

    div.innerHTML=`

      <div class="top">

        <div>
          <div class="name">${stock.name}</div>
          <div style="color:#94a3b8">${stock.symbol}</div>
        </div>

        <div class="${up ? 'green':'red'}"
          style="font-size:1.2rem;font-weight:bold">

          ${up ? '▲':'▼'} ${Math.abs(change)}%

        </div>

      </div>

      <div class="price ${up ? 'green':'red'}">

        ${stock.price} kr

      </div>

      <svg width="100%" height="70">

        <polyline
          fill="none"
          stroke="${up ? '#00ff88':'#ff4d6d'}"
          stroke-width="4"
          points="${graph(stock.history)}"
        />

      </svg>

      <div class="owned">

        Du ejer ${stock.owned} aktier

      </div>

      <div class="controls">

        <input
          type="number"
          value="1"
          min="1"
          id="amount-${index}"
        >

        <button
          class="buy"
          onclick="buy(${index})"
        >
          Køb
        </button>

        <button
          class="sell"
          onclick="sell(${index})"
        >
          Sælg
        </button>

      </div>

    `;

    stocksDiv.appendChild(div);
  });

  updatePortfolio();
}

function updateMarket(){

  stocks.forEach(stock=>{

    const move = (Math.random()*10-5);

    stock.price += move * 5;

    if(stock.price < 100){
      stock.price = 100;
    }

    stock.price = Math.floor(stock.price);

    stock.history.push(stock.price);

    if(stock.history.length > 12){
      stock.history.shift();
    }
  });

  const randomNews =
    newsList[Math.floor(Math.random()*newsList.length)];

  document.getElementById('news').textContent = randomNews;

  render();
}

function buy(index){

  const amount =
    Number(document.getElementById(`amount-${index}`).value);

  const cost = amount * stocks[index].price;

  if(money >= cost){

    money -= cost;

    stocks[index].owned += amount;

    updatePortfolio();

    render();

  } else {

    alert('❌ Ikke nok penge');
  }
}

function sell(index){

  const amount =
    Number(document.getElementById(`amount-${index}`).value);

  if(stocks[index].owned >= amount){

    stocks[index].owned -= amount;

    money += amount * stocks[index].price;

    updatePortfolio();

    render();

  } else {

    alert('❌ Du ejer ikke så mange');
  }
}

function updatePortfolio(){

  let portfolio = 0;

  const table = document.getElementById('table');

  table.innerHTML='';

  stocks.forEach(stock=>{

    const total = stock.price * stock.owned;

    portfolio += total;

    if(stock.owned > 0){

      const row = document.createElement('tr');

      row.innerHTML=`

        <td>${stock.name}</td>
        <td>${stock.owned}</td>
        <td>${stock.price} kr</td>
        <td>${Math.floor(total)} kr</td>

      `;

      table.appendChild(row);
    }
  });

  const worth = money + portfolio;

  document.getElementById('money').textContent =
    Math.floor(money)+' kr';

  document.getElementById('portfolio').textContent =
    Math.floor(portfolio)+' kr';

  document.getElementById('worth').textContent =
    Math.floor(worth)+' kr';

  const achievement =
    document.getElementById('achievement');

  if(worth >= 250000){

    achievement.textContent =
      '🔥 AKTIE KONGE 🔥';

  } else if(worth >= 150000){

    achievement.textContent =
      '🚀 Du bliver hurtigt rig!';

  } else {

    achievement.textContent = '';
  }
}

render();

updatePortfolio();

updateMarket();

setInterval(updateMarket, 3600000);

/*

3600000 = 1 time

Hvis du tester:
brug fx 60000 for 1 minut

*/

</script>
