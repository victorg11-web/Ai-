<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aktie Master</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 30px;
      color: #cbd5e1;
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .card h2 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #94a3b8;
    }

    .value {
      font-size: 2rem;
      font-weight: bold;
    }

    .green {
      color: #22c55e;
    }

    .red {
      color: #ef4444;
    }

    .stocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .stock-card {
      background: rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .stock-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .stock-name {
      font-size: 1.4rem;
      font-weight: bold;
    }

    .price {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      width: 80px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #1e293b;
      color: white;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .buy {
      background: #22c55e;
      color: white;
    }

    .sell {
      background: #ef4444;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }

    .portfolio {
      margin-top: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      overflow: hidden;
    }

    th, td {
      padding: 15px;
      text-align: center;
    }

    th {
      background: rgba(255,255,255,0.1);
    }

    tr:nth-child(even) {
      background: rgba(255,255,255,0.03);
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      color: #94a3b8;
    }

    .winner {
      margin-top: 20px;
      text-align: center;
      font-size: 1.5rem;
      color: gold;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>📈 Aktie Master</h1>
  <p class="subtitle">Start med 100.000 kr og bliv den bedste investor!</p>

  <div class="topbar">
    <div class="card">
      <h2>💰 Penge</h2>
      <div class="value" id="money">100000 kr</div>
    </div>

    <div class="card">
      <h2>📊 Portfolio Værdi</h2>
      <div class="value green" id="portfolioValue">0 kr</div>
    </div>

    <div class="card">
      <h2>🏆 Total Formue</h2>
      <div class="value" id="netWorth">100000 kr</div>
    </div>
  </div>

  <div class="stocks" id="stocks"></div>

  <div class="portfolio">
    <h2>📁 Din Portfolio</h2>

    <table>
      <thead>
        <tr>
          <th>Aktie</th>
          <th>Antal</th>
          <th>Pris</th>
          <th>Værdi</th>
        </tr>
      </thead>
      <tbody id="portfolioTable"></tbody>
    </table>

    <div class="winner" id="winner"></div>
  </div>

  <div class="footer">
    Lavet med HTML, CSS og JavaScript 🚀
  </div>

  <script>
    let money = 100000;

    const stocks = [
      {
        name: 'Tesla',
        price: 1200,
        owned: 0,
      },
      {
        name: 'Apple',
        price: 900,
        owned: 0,
      },
      {
        name: 'NVIDIA',
        price: 1500,
        owned: 0,
      },
      {
        name: 'Microsoft',
        price: 800,
        owned: 0,
      },
      {
        name: 'Amazon',
        price: 1000,
        owned: 0,
      },
      {
        name: 'Meta',
        price: 700,
        owned: 0,
      }
    ];

    const stocksDiv = document.getElementById('stocks');

    function renderStocks() {
      stocksDiv.innerHTML = '';

      stocks.forEach((stock, index) => {
        const change = (Math.random() * 10 - 5).toFixed(2);
        stock.price = Math.max(100, stock.price + Number(change) * 10);

        const div = document.createElement('div');
        div.className = 'stock-card';

        div.innerHTML = `
          <div class="stock-header">
            <div class="stock-name">${stock.name}</div>
            <div class="${change >= 0 ? 'green' : 'red'}">
              ${change >= 0 ? '+' : ''}${change}%
            </div>
          </div>

          <div class="price">${Math.floor(stock.price)} kr</div>

          <div>Du ejer: ${stock.owned}</div>

          <div class="controls">
            <input type="number" min="1" value="1" id="amount-${index}" />
            <button class="buy" onclick="buyStock(${index})">Køb</button>
            <button class="sell" onclick="sellStock(${index})">Sælg</button>
          </div>
        `;

        stocksDiv.appendChild(div);
      });

      updatePortfolio();
    }

    function buyStock(index) {
      const amount = Number(document.getElementById(`amount-${index}`).value);
      const total = amount * stocks[index].price;

      if (money >= total) {
        money -= total;
        stocks[index].owned += amount;
        renderStocks();
      } else {
        alert('Du har ikke nok penge!');
      }
    }

    function sellStock(index) {
      const amount = Number(document.getElementById(`amount-${index}`).value);

      if (stocks[index].owned >= amount) {
        stocks[index].owned -= amount;
        money += amount * stocks[index].price;
        renderStocks();
      } else {
        alert('Du ejer ikke så mange aktier!');
      }
    }

    function updatePortfolio() {
      document.getElementById('money').textContent = Math.floor(money) + ' kr';

      let portfolio = 0;
      const table = document.getElementById('portfolioTable');
      table.innerHTML = '';

      stocks.forEach(stock => {
        const value = stock.owned * stock.price;
        portfolio += value;

        if (stock.owned > 0) {
          const row = document.createElement('tr');

          row.innerHTML = `
            <td>${stock.name}</td>
            <td>${stock.owned}</td>
            <td>${Math.floor(stock.price)} kr</td>
            <td>${Math.floor(value)} kr</td>
          `;

          table.appendChild(row);
        }
      });

      const netWorth = money + portfolio;

      document.getElementById('portfolioValue').textContent = Math.floor(portfolio) + ' kr';
      document.getElementById('netWorth').textContent = Math.floor(netWorth) + ' kr';

      const winner = document.getElementById('winner');

      if (netWorth >= 250000) {
        winner.textContent = '🔥 Du er blevet en aktie-millionær-legende! 🔥';
      } else {
        winner.textContent = '';
      }
    }

    setInterval(renderStocks, 3000);

    renderStocks();
  </script>
</body>
</html>
