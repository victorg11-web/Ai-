<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Empire X</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0f172a;
  color:white;
  padding:30px;
}

h1{
  text-align:center;
  font-size:4rem;
  color:#00ff88;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:40px;
}

.profile{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  display:flex;
  gap:20px;
  align-items:center;
  margin-bottom:40px;
  flex-wrap:wrap;
}

.profile img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #00ff88;
}

.profile-info{
  flex:1;
}

.profile-info h2{
  margin-bottom:10px;
}

.profile input{
  padding:12px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:white;
  width:100%;
  margin-top:10px;
}

.profile button{
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00ff88;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.card{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
}

.number{
  font-size:2rem;
  margin-top:10px;
  font-weight:bold;
}

.green{
  color:#00ff88;
}

.red{
  color:#ff4d6d;
}

.stocks{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}

.stock{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.name{
  font-size:1.7rem;
  font-weight:bold;
}

.price{
  font-size:2rem;
  margin-bottom:10px;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.controls input{
  width:90px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#0f172a;
  color:white;
  text-align:center;
}

.controls button{
  flex:1;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.buy{
  background:#00ff88;
  color:black;
}

.sell{
  background:#ff4d6d;
  color:white;
}

#news{
  margin-top:40px;
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  text-align:center;
  color:#ffe600;
  font-size:1.1rem;
}

table{
  width:100%;
  margin-top:40px;
  border-collapse:collapse;
  background:#1e293b;
  border-radius:20px;
  overflow:hidden;
}

th,td{
  padding:15px;
  text-align:center;
}

th{
  background:#334155;
}

#achievement{
  margin-top:30px;
  text-align:center;
  font-size:2rem;
  color:gold;
  font-weight:bold;
}

</style>
</head>

<body>

<h1>📈 STOCK EMPIRE X</h1>

<p class="subtitle">
Byg dit firma • Køb aktier • Bliv milliardær
</p>

<div class="profile">

<img
id="profileImage"
src="https://i.imgur.com/6VBx3io.png"
>

<div class="profile-info">

<h2 id="playerName">
Investor
</h2>

<p>
🏢 Firma Værdi:
<span id="companyValue">
100000 kr
</span>
</p>

<input
type="text"
id="nameInput"
placeholder="Dit navn"
>

<input
type="text"
id="imageInput"
placeholder="Profil billede URL"
>

<button onclick="saveProfile()">
Gem Profil
</button>

</div>

</div>

<div class="stats">

<div class="card">
💰 Penge
<div class="number" id="money">
100000 kr
</div>
</div>

<div class="card">
📊 Portfolio
<div class="number green" id="portfolio">
0 kr
</div>
</div>

<div class="card">
🏦 Total Formue
<div class="number" id="worth">
100000 kr
</div>
</div>

</div>

<div class="stocks" id="stocks"></div>

<div id="news">
🚀 Markedet åbner stærkt i dag!
</div>

<table>

<thead>
<tr>
<th>Aktie</th>
<th>Antal</th>
<th>Pris</th>
<th>Værdi</th>
</tr>
</thead>

<tbody id="table"></tbody>

</table>

<div id="achievement"></div>

<script>

let money = 100000;

const newsList = [

'🚀 Tesla stiger!',
'📉 Apple falder!',
'🔥 NVIDIA eksploderer!',
'💰 Amazon vokser!',
'⚡ Microsoft investerer i AI!',
'📈 Markedet går grønt!'

];

const stocks = [

{
name:'Tesla',
symbol:'TSLA',
price:1200,
owned:0,
history:[1200]
},

{
name:'Apple',
symbol:'AAPL',
price:900,
owned:0,
history:[900]
},

{
name:'NVIDIA',
symbol:'NVDA',
price:1500,
owned:0,
history:[1500]
},

{
name:'Microsoft',
symbol:'MSFT',
price:800,
owned:0,
history:[800]
},

{
name:'Amazon',
symbol:'AMZN',
price:1400,
owned:0,
history:[1400]
},

{
name:'Meta',
symbol:'META',
price:1000,
owned:0,
history:[1000]
},

{
name:'Google',
symbol:'GOOGL',
price:1600,
owned:0,
history:[1600]
},

{
name:'Netflix',
symbol:'NFLX',
price:1100,
owned:0,
history:[1100]
}

];

const stocksDiv =
document.getElementById('stocks');

function saveProfile(){

const name =
document.getElementById('nameInput').value;

const image =
document.getElementById('imageInput').value;

if(name){
document.getElementById('playerName').textContent =
name;
}

if(image){
document.getElementById('profileImage').src =
image;
}

}

function graph(history){

const max = Math.max(...history);

const min = Math.min(...history);

return history.map((p,i)=>{

const y =
60 - ((p-min)/(max-min || 1))*50;

return `${i*20},${y}`;

}).join(' ');
}

function render(){

stocksDiv.innerHTML='';

stocks.forEach((stock,index)=>{

const previous =
stock.history[stock.history.length-2]
|| stock.price;

const up =
stock.price >= previous;

const change =
(((stock.price-previous)/previous)*100)
.toFixed(2);

const div =
document.createElement('div');

div.className='stock';

div.innerHTML=`

<div class="top">

<div>

<div class="name">
${stock.name}
</div>

<div style="color:#94a3b8">
${stock.symbol}
</div>

</div>

<div class="${up ? 'green':'red'}">

${up ? '▲':'▼'}
${Math.abs(change)}%

</div>

</div>

<div class="price ${up ? 'green':'red'}">

${stock.price} kr

</div>

<svg width="100%" height="70">

<polyline
fill="none"
stroke="${up ? '#00ff88':'#ff4d6d'}"
stroke-width="4"
points="${graph(stock.history)}"
/>

</svg>

<div style="margin-top:10px;color:#94a3b8">

Du ejer ${stock.owned} aktier

</div>

<div class="controls">

<input
type="number"
value="1"
min="1"
id="amount-${index}"
>

<button
class="buy"
onclick="buy(${index})"
>
Køb
</button>

<button
class="sell"
onclick="sell(${index})"
>
Sælg
</button>

</div>

`;

stocksDiv.appendChild(div);

});

updatePortfolio();

}

function updateMarket(){

stocks.forEach(stock=>{

const move =
Math.floor(Math.random()*200-100);

stock.price += move;

if(stock.price < 100){
stock.price = 100;
}

stock.history.push(stock.price);

if(stock.history.length > 10){
stock.history.shift();
}

});

const randomNews =
newsList[Math.floor(Math.random()*newsList.length)];

document.getElementById('news').textContent =
randomNews;

render();

}

function buy(index){

const amount =
Number(document.getElementById(`amount-${index}`).value);

const cost =
amount * stocks[index].price;

if(money >= cost){

money -= cost;

stocks[index].owned += amount;

render();

}else{

alert('❌ Ikke nok penge');

}

}

function sell(index){

const amount =
Number(document.getElementById(`amount-${index}`).value);

if(stocks[index].owned >= amount){

stocks[index].owned -= amount;

money += amount * stocks[index].price;

render();

}else{

alert('❌ Du ejer ikke så mange');

}

}

function updatePortfolio(){

let portfolio = 0;

const table =
document.getElementById('table');

table.innerHTML='';

stocks.forEach(stock=>{

const total =
stock.price * stock.owned;

portfolio += total;

if(stock.owned > 0){

const row =
document.createElement('tr');

row.innerHTML=`

<td>${stock.name}</td>
<td>${stock.owned}</td>
<td>${stock.price} kr</td>
<td>${Math.floor(total)} kr</td>

`;

table.appendChild(row);

}

});

const worth =
money + portfolio;

document.getElementById('money').textContent =
Math.floor(money)+' kr';

document.getElementById('portfolio').textContent =
Math.floor(portfolio)+' kr';

document.getElementById('worth').textContent =
Math.floor(worth)+' kr';

document.getElementById('companyValue').textContent =
Math.floor(worth)+' kr';

const achievement =
document.getElementById('achievement');

if(worth >= 1000000){

achievement.textContent =
'👑 DU ER BLEVET MILLIARDÆR 👑';

}else if(worth >= 250000){

achievement.textContent =
'🔥 AKTIE KONGE 🔥';

}else{

achievement.textContent = '';

}

}

render();

updatePortfolio();

/*

AKTIER ÆNDRER SIG HVER TIME

3600000 = 1 time

TEST:
brug 10000 for 10 sekunder

*/

setInterval(updateMarket,3600000);

</script>

</body>
</html>
