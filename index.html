<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Empire X</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    body{
      font-family:'Orbitron',sans-serif;
      background:#020617;
      color:white;
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg{
      position:fixed;
      width:700px;
      height:700px;
      background:rgba(0,255,170,0.08);
      border-radius:50%;
      filter:blur(100px);
      top:-200px;
      right:-200px;
    }

    .container{
      position:relative;
      z-index:2;
      padding:30px;
      max-width:1600px;
      margin:auto;
    }

    h1{
      text-align:center;
      font-size:5rem;
      margin-bottom:10px;
      background:linear-gradient(90deg,#00f5ff,#00ff88,#ffe600);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      text-align:center;
      color:#94a3b8;
      margin-bottom:40px;
      font-size:1.2rem;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-bottom:40px;
    }

    .card{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:25px;
      padding:25px;
      backdrop-filter:blur(10px);
    }

    .label{
      color:#94a3b8;
      margin-bottom:10px;
    }

    .number{
      font-size:2.2rem;
      font-weight:bold;
    }

    .stocks{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
      gap:25px;
    }

    .stock{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:25px;
      padding:25px;
      transition:0.3s;
    }

    .stock:hover{
      transform:translateY(-8px);
      box-shadow:0 20px 40px rgba(0,255,170,0.15);
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .name{
      font-size:1.8rem;
      font-weight:bold;
    }

    .price{
      font-size:2rem;
      margin-bottom:10px;
    }

    .green{color:#00ff88}
    .red{color:#ff4d6d}

    .owned{
      color:#94a3b8;
      margin:15px 0;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-top:15px;
    }

    input{
      width:90px;
      padding:12px;
      border:none;
      border-radius:12px;
      background:#111827;
      color:white;
      text-align:center;
      font-weight:bold;
    }

    button{
      flex:1;
      border:none;
      border-radius:12px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      transform:scale(1.05)
    }

    .buy{
      background:linear-gradient(90deg,#00ff88,#00d4ff);
      color:black;
    }

    .sell{
      background:linear-gradient(90deg,#ff4d6d,#ff8a00);
      color:white;
    }

    svg{
      margin-top:10px;
    }

    .news{
      margin-top:40px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:25px;
      padding:25px;
      text-align:center;
      color:#ffe600;
      font-size:1.1rem;
    }

    table{
      width:100%;
      margin-top:25px;
      border-collapse:collapse;
      background:rgba(255,255,255,0.05);
      border-radius:20px;
      overflow:hidden;
    }

    th,td{
      padding:18px;
      text-align:center;
    }

    th{
      background:rgba(255,255,255,0.08);
      color:#00ffcc;
    }

    .achievement{
      margin-top:30px;
      text-align:center;
      font-size:2rem;
      color:gold;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="bg"></div>

<div class="container">

<h1>STOCK EMPIRE X</h1>
<p class="subtitle">Handel aktier • Se markedet live • Bliv rig 📈</p>

<div class="stats">
  <div class="card">
    <div class="label">💰 Kontanter</div>
    <div class="number" id="money">100000 kr</div>
  </div>

  <div class="card">
    <div class="label">📊 Aktie værdi</div>
    <div class="number green" id="portfolio">0 kr</div>
  </div>

  <div class="card">
    <div class="label">🏦 Total formue</div>
    <div class="number" id="worth">100000 kr</div>
  </div>
</div>

<div class="stocks" id="stocks"></div>

<div class="news" id="news">🚀 Markedet er grønt i dag!</div>

<h2 style="margin-top:50px">📁 Din Portfolio</h2>

<table>
  <thead>
    <tr>
      <th>Aktie</th>
      <th>Antal</th>
      <th>Pris</th>
      <th>Værdi</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<div class="achievement" id="achievement"></div>

</div>

<script>

let money = 100000;

const newsList = [
  '🚀 Tesla stiger efter nye AI biler!',
  '📉 Apple falder efter dårlige salgstal!',
  '🔥 NVIDIA eksploderer i gaming markedet!',
  '💰 Microsoft investerer milliarder i AI!',
  '⚡ Amazon vokser hurtigt i dag!',
  '📈 Hele markedet går op!'
];

const stocks = [
  {name:'Tesla',symbol:'TSLA',price:1200,owned:0,history:[1200]},
  {name:'Apple',symbol:'AAPL',price:900,owned:0,history:[900]},
  {name:'NVIDIA',symbol:'NVDA',price:1500,owned:0,history:[1500]},
  {name:'Microsoft',symbol:'MSFT',price:800,owned:0,history:[800]}
];

const stocksDiv = document.getElementById('stocks');

function graph(history){

  const max = Math.max(...history);
  const min = Math.min(...history);

  return history.map((p,i)=>{
    const y = 60 - ((p-min)/(max-min || 1))*50;
    return `${i*20},${y}`;
  }).join(' ');
}

function render(){

  stocksDiv.innerHTML='';

  stocks.forEach((stock,index)=>{

    const oldPrice = stock.price;

    const move = (Math.random()*10-5);

    stock.price += move*5;

    if(stock.price < 100) stock.price = 100;

    stock.price = Math.floor(stock.price);

    stock.history.push(stock.price);

    if(stock.history.length > 10){
      stock.history.shift();
    }

    const up = stock.price >= oldPrice;

    const div = document.createElement('div');
    div.className='stock';

    div.innerHTML=`

      <div class="top">
        <div>
          <div class="name">${stock.name}</div>
          <div style="color:#94a3b8">${stock.symbol}</div>
        </div>

        <div class="${up ? 'green':'red'}" style="font-size:1.2rem;font-weight:bold">
          ${up ? '▲':'▼'} ${Math.abs(move).toFixed(2)}%
        </div>
      </div>

      <div class="price ${up ? 'green':'red'}">
        ${stock.price} kr
      </div>

      <svg width="100%" height="70">
        <polyline
          fill="none"
          stroke="${up ? '#00ff88':'#ff4d6d'}"
          stroke-width="4"
          points="${graph(stock.history)}"
        />
      </svg>

      <div class="owned">Du ejer ${stock.owned} aktier</div>

      <div class="controls">
        <input type="number" value="1" min="1" id="amount-${index}">

        <button class="buy" onclick="buy(${index})">Køb</button>

        <button class="sell" onclick="sell(${index})">Sælg</button>
      </div>

    `;

    stocksDiv.appendChild(div);
  });

  updatePortfolio();
}

function buy(index){

  const amount = Number(document.getElementById(`amount-${index}`).value);

  const cost = amount * stocks[index].price;

  if(money >= cost){

    money -= cost;

    stocks[index].owned += amount;

    render();

  } else {

    alert('❌ Ikke nok penge');
  }
}

function sell(index){

  const amount = Number(document.getElementById(`amount-${index}`).value);

  if(stocks[index].owned >= amount){

    stocks[index].owned -= amount;

    money += amount * stocks[index].price;

    render();

  } else {

    alert('❌ Du ejer ikke så mange');
  }
}

function updatePortfolio(){

  let portfolio = 0;

  const table = document.getElementById('table');

  table.innerHTML='';

  stocks.forEach(stock=>{

    const total = stock.price * stock.owned;

    portfolio += total;

    if(stock.owned > 0){

      const row = document.createElement('tr');

      row.innerHTML=`
        <td>${stock.name}</td>
        <td>${stock.owned}</td>
        <td>${stock.price} kr</td>
        <td>${Math.floor(total)} kr</td>
      `;

      table.appendChild(row);
    }
  });

  const worth = money + portfolio;

  document.getElementById('money').textContent = Math.floor(money)+' kr';
  document.getElementById('portfolio').textContent = Math.floor(portfolio)+' kr';
  document.getElementById('worth').textContent = Math.floor(worth)+' kr';

  const achievement = document.getElementById('achievement');

  if(worth >= 250000){
    achievement.textContent='🔥 AKTIE KONGE 🔥';
  } else if(worth >= 150000){
    achievement.textContent='🚀 Du bliver hurtigt rig!';
  } else {
    achievement.textContent='';
  }
}

setInterval(()=>{

  render();

  const randomNews = newsList[Math.floor(Math.random()*newsList.length)];

  document.getElementById('news').textContent = randomNews;

},3000);

render();

</script>

</body>
</html>
