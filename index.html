<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Empire X</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      padding:30px;
    }

    h1{
      text-align:center;
      margin-bottom:10px;
      font-size:4rem;
      color:#00ff88;
    }

    .subtitle{
      text-align:center;
      color:#94a3b8;
      margin-bottom:40px;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-bottom:40px;
    }

    .card{
      background:#1e293b;
      padding:25px;
      border-radius:20px;
    }

    .number{
      font-size:2rem;
      margin-top:10px;
      font-weight:bold;
    }

    .stocks{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:25px;
    }

    .stock{
      background:#1e293b;
      padding:25px;
      border-radius:20px;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .name{
      font-size:1.7rem;
      font-weight:bold;
    }

    .price{
      font-size:2rem;
      margin-bottom:15px;
    }

    .green{
      color:#00ff88;
    }

    .red{
      color:#ff4d6d;
    }

    .owned{
      margin:15px 0;
      color:#94a3b8;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-top:15px;
    }

    input{
      width:90px;
      padding:10px;
      border:none;
      border-radius:10px;
      background:#0f172a;
      color:white;
      text-align:center;
    }

    button{
      flex:1;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .buy{
      background:#00ff88;
      color:black;
    }

    .sell{
      background:#ff4d6d;
      color:white;
    }

    #news{
      margin-top:40px;
      background:#1e293b;
      padding:20px;
      border-radius:20px;
      text-align:center;
      color:#ffe600;
      font-size:1.1rem;
    }

    table{
      width:100%;
      margin-top:40px;
      border-collapse:collapse;
      background:#1e293b;
      border-radius:20px;
      overflow:hidden;
    }

    th,td{
      padding:15px;
      text-align:center;
    }

    th{
      background:#334155;
    }

    #achievement{
      text-align:center;
      font-size:2rem;
      color:gold;
      margin-top:30px;
      font-weight:bold;
    }

  </style>
</head>

<body>

<h1>📈 STOCK EMPIRE X</h1>

<p class="subtitle">
  Køb aktier • Bliv rig • Følg markedet live
</p>

<div class="stats">

  <div class="card">
    <div>💰 Penge</div>
    <div class="number" id="money">
      100000 kr
    </div>
  </div>

  <div class="card">
    <div>📊 Portfolio</div>
    <div class="number green" id="portfolio">
      0 kr
    </div>
  </div>

  <div class="card">
    <div>🏦 Total Formue</div>
    <div class="number" id="worth">
      100000 kr
    </div>
  </div>

</div>

<div class="stocks" id="stocks"></div>

<div id="news">
  🚀 Markedet åbner stærkt i dag!
</div>

<table>

  <thead>
    <tr>
      <th>Aktie</th>
      <th>Antal</th>
      <th>Pris</th>
      <th>Værdi</th>
    </tr>
  </thead>

  <tbody id="table"></tbody>

</table>

<div id="achievement"></div>

<script>

let money = 100000;

const newsList = [

  '🚀 Tesla stiger efter nye AI biler!',
  '📉 Apple falder efter dårlige salgstal!',
  '🔥 NVIDIA eksploderer i gaming markedet!',
  '💰 Microsoft investerer milliarder i AI!',
  '⚡ Amazon vokser hurtigt!',
  '📈 Hele markedet går op!'

];

const stocks = [

  {
    name:'Tesla',
    symbol:'TSLA',
    price:1200,
    owned:0,
    history:[1200]
  },

  {
    name:'Apple',
    symbol:'AAPL',
    price:900,
    owned:0,
    history:[900]
  },

  {
    name:'NVIDIA',
    symbol:'NVDA',
    price:1500,
    owned:0,
    history:[1500]
  },

  {
    name:'Microsoft',
    symbol:'MSFT',
    price:800,
    owned:0,
    history:[800]
  }

];

const stocksDiv = document.getElementById('stocks');

function graph(history){

  const max = Math.max(...history);

  const min = Math.min(...history);

  return history.map((p,i)=>{

    const y =
      60 - ((p-min)/(max-min || 1))*50;

    return `${i*20},${y}`;

  }).join(' ');
}

function render(){

  stocksDiv.innerHTML='';

  stocks.forEach((stock,index)=>{

    const previous =
      stock.history[stock.history.length-2]
      || stock.price;

    const up = stock.price >= previous;

    const change =
      (((stock.price-previous)/previous)*100)
      .toFixed(2);

    const div = document.createElement('div');

    div.className='stock';

    div.innerHTML=`

      <div class="top">

        <div>

          <div class="name">
            ${stock.name}
          </div>

          <div style="color:#94a3b8">
            ${stock.symbol}
          </div>

        </div>

        <div class="${up ? 'green':'red'}">

          ${up ? '▲':'▼'}
          ${Math.abs(change)}%

        </div>

      </div>

      <div class="price ${up ? 'green':'red'}">

        ${stock.price} kr

      </div>

      <svg width="100%" height="70">

        <polyline
          fill="none"
          stroke="${up ? '#00ff88':'#ff4d6d'}"
          stroke-width="4"
          points="${graph(stock.history)}"
        />

      </svg>

      <div class="owned">

        Du ejer ${stock.owned} aktier

      </div>

      <div class="controls">

        <input
          type="number"
          value="1"
          min="1"
          id="amount-${index}"
        >

        <button
          class="buy"
          onclick="buy(${index})"
        >
          Køb
        </button>

        <button
          class="sell"
          onclick="sell(${index})"
        >
          Sælg
        </button>

      </div>

    `;

    stocksDiv.appendChild(div);

  });

  updatePortfolio();
}

function updateMarket(){

  stocks.forEach(stock=>{

    const move =
      (Math.random()*10-5);

    stock.price += move*5;

    if(stock.price < 100){
      stock.price = 100;
    }

    stock.price = Math.floor(stock.price);

    stock.history.push(stock.price);

    if(stock.history.length > 10){
      stock.history.shift();
    }

  });

  const randomNews =
    newsList[Math.floor(Math.random()*newsList.length)];

  document.getElementById('news').textContent =
    randomNews;

  render();
}

function buy(index){

  const amount =
    Number(document.getElementById(`amount-${index}`).value);

  const cost =
    amount * stocks[index].price;

  if(money >= cost){

    money -= cost;

    stocks[index].owned += amount;

    render();

  } else {

    alert('❌ Ikke nok penge');

  }
}

function sell(index){

  const amount =
    Number(document.getElementById(`amount-${index}`).value);

  if(stocks[index].owned >= amount){

    stocks[index].owned -= amount;

    money += amount * stocks[index].price;

    render();

  } else {

    alert('❌ Du ejer ikke så mange');

  }
}

function updatePortfolio(){

  let portfolio = 0;

  const table =
    document.getElementById('table');

  table.innerHTML='';

  stocks.forEach(stock=>{

    const total =
      stock.price * stock.owned;

    portfolio += total;

    if(stock.owned > 0){

      const row =
        document.createElement('tr');

      row.innerHTML=`

        <td>${stock.name}</td>
        <td>${stock.owned}</td>
        <td>${stock.price} kr</td>
        <td>${Math.floor(total)} kr</td>

      `;

      table.appendChild(row);
    }

  });

  const worth =
    money + portfolio;

  document.getElementById('money').textContent =
    Math.floor(money)+' kr';

  document.getElementById('portfolio').textContent =
    Math.floor(portfolio)+' kr';

  document.getElementById('worth').textContent =
    Math.floor(worth)+' kr';

  const achievement =
    document.getElementById('achievement');

  if(worth >= 250000){

    achievement.textContent =
      '🔥 AKTIE KONGE 🔥';

  } else if(worth >= 150000){

    achievement.textContent =
      '🚀 Du bliver hurtigt rig!';

  } else {

    achievement.textContent = '';

  }

}

render();

updatePortfolio();

updateMarket();

/*

ÆNDRER AKTIER HVER TIME

3600000 = 1 time

TEST:
brug 60000 for 1 minut

*/

setInterval(updateMarket,3600000);

</script>

</body>
</html>
