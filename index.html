<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Slope PRO</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  #ui {
    position: absolute;
    top: 10px;
    left: 20px;
    color: #00ffcc;
    font-family: Arial;
  }
</style>
</head>
<body>

<div id="ui">
  Score: <span id="score">0</span><br>
  Highscore: <span id="highscore">0</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<!-- POSTPROCESS (GLOW) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();

// CAMERA
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);

// RENDER
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// BLOOM (REAL GLOW)
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));

const bloom = new THREE.UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.5, // strength
  0.4, // radius
  0.2  // threshold
);
composer.addPass(bloom);

// LIGHT
const light = new THREE.PointLight(0x00ffcc, 2, 100);
scene.add(light);

// BALL (SMOOTH PHYSICS)
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 32, 32),
  new THREE.MeshStandardMaterial({
    color: 0x00ff88,
    emissive: 0x00ff88,
    emissiveIntensity: 2
  })
);
scene.add(ball);

let velocityX = 0;
let velocityZ = 0.4;

// PLATFORMS
let objects = [];

function createPlatform(z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(5, 0.5, 10),
    new THREE.MeshStandardMaterial({
      color: 0x0088ff,
      emissive: 0x0044ff,
      emissiveIntensity: 1
    })
  );

  mesh.position.z = z;
  mesh.position.x = (Math.random() - 0.5) * 4;
  mesh.rotation.z = (Math.random() - 0.5) * 0.5;

  scene.add(mesh);
  objects.push(mesh);

  // obstacle
  if (Math.random() < 0.3) {
    const o = new THREE.Mesh(
      new THREE.BoxGeometry(1,1,1),
      new THREE.MeshStandardMaterial({
        color: 0xff0000,
        emissive: 0xff0000,
        emissiveIntensity: 3
      })
    );
    o.position.copy(mesh.position);
    o.position.y = 1;
    o.userData.obstacle = true;
    scene.add(o);
    objects.push(o);
  }
}

// INIT WORLD
for (let i = 0; i < 20; i++) createPlatform(-i * 10);

// CONTROLS (KEYBOARD)
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") velocityX = -0.15;
  if (e.key === "ArrowRight") velocityX = 0.15;
});
document.addEventListener("keyup", () => velocityX *= 0.5);

// MOBILE TOUCH
document.addEventListener("touchmove", e => {
  let x = e.touches[0].clientX / innerWidth;
  velocityX = (x - 0.5) * 0.3;
});

// SOUND (BACKGROUND)
const audio = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_115b9bcecc.mp3");
audio.loop = true;
audio.volume = 0.3;
document.body.addEventListener("click", () => audio.play(), { once: true });

// SCORE + HIGHSCORE
let score = 0;
let highscore = localStorage.getItem("slopeHigh") || 0;
document.getElementById("highscore").innerText = highscore;

// LOOP
function animate() {
  requestAnimationFrame(animate);

  // PHYSICS
  velocityX *= 0.95; // friction
  velocityZ += 0.0008;

  ball.position.x += velocityX;
  ball.position.z -= velocityZ;

  // CAMERA FOLLOW
  camera.position.set(
    ball.position.x,
    ball.position.y + 3,
    ball.position.z + 6
  );
  camera.lookAt(ball.position);

  light.position.copy(ball.position);

  // COLLISION
  objects.forEach(o => {
    if (o.userData.obstacle) {
      if (ball.position.distanceTo(o.position) < 1) {
        gameOver();
      }
    }
  });

  // GENERATE WORLD
  if (objects.length && objects[0].position.z > ball.position.z + 20) {
    scene.remove(objects[0]);
    objects.shift();
    createPlatform(ball.position.z - 200);
  }

  // SCORE
  score++;
  document.getElementById("score").innerText = score;

  composer.render();
}

function gameOver() {
  if (score > highscore) {
    localStorage.setItem("slopeHigh", score);
  }
  alert("Game Over! Score: " + score);
  location.reload();
}

animate();
</script>

</body>
</html>
